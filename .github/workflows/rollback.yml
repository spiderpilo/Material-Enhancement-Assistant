name: Rollback

# Redeploys an image that a previous Deploy run already pushed, without rebuilding.
# Database migrations are not reverted; they are additive and idempotent.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to roll back
        type: choice
        options: [backend, frontend]
      sha:
        description: Full commit SHA of the image to redeploy (from an earlier Deploy run)
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image
        id: image
        env:
          SERVICE: ${{ inputs.service }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mea-${SERVICE}:${SHA}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker manifest inspect "$image" >/dev/null || { echo "::error::$image does not exist in GHCR"; exit 1; }
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - name: Deploy to Render and wait until live
        env:
          RENDER_DEPLOY_HOOK: ${{ inputs.service == 'backend' && secrets.RENDER_BACKEND_DEPLOY_HOOK || secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          BASE_URL: ${{ inputs.service == 'backend' && vars.BACKEND_URL || vars.FRONTEND_URL }}
          HEALTH_PATH: ${{ inputs.service == 'backend' && '/health' || '/api/health' }}
        run: bash .github/scripts/render_deploy.sh "${{ steps.image.outputs.ref }}" "$BASE_URL" "$HEALTH_PATH" "${{ inputs.sha }}"
      - name: Point :main at the rolled-back image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker buildx imagetools create --tag "${IMAGE%:*}:main" "$IMAGE"
